---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  labels:
    app.kubernetes.io/name: zookeeper
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: zookeeper
  ports:
    - port: 2181
      targetPort: 2181
      protocol: TCP
      name: client
    - port: 2888
      targetPort: 2888
      protocol: TCP
      name: peer
    - port: 3888
      targetPort: 3888
      protocol: TCP
      name: leader-election

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  labels:
    app.kubernetes.io/name: zookeeper
spec:
  serviceName: zookeeper
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zookeeper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zookeeper
    spec:
      containers:
        - name: zookeeper
          image: zookeeper:3.7.0
          imagePullPolicy: IfNotPresent
          env:
            - name: ZOO_AUTOPURGE_PURGEINTERVAL
              value: '1'
            - name: ZOO_AUTOPURGE_SNAPRETAINCOUNT
              value: '3'
          ports:
            - containerPort: 2181
              name: client
            - containerPort: 2888
              name: peer
            - containerPort: 3888
              name: leader-election
          volumeMounts:
            - name: data
              mountPath: /data
            - name: datalog
              mountPath: /datalog
            - name: logs
              mountPath: /logs
          resources:
            requests:
              cpu: '25m'
              memory: '128Mi'
            limits:
              memory: '512Mi'
          readinessProbe:
            tcpSocket:
              port: 2181
          livenessProbe:
            tcpSocket:
              port: 2181
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: '2Gi'
    - metadata:
        name: datalog
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: '2Gi'
    - metadata:
        name: logs
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: '1Gi'
