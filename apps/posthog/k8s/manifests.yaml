            - name: OBJECT_STORAGE_ENABLED
              value: 'true'
            - name: OBJECT_STORAGE_FORCE_PATH_STYLE
              value: 'true'
            - name: OBJECT_STORAGE_BUCKET
              value: posthog
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: posthog-secrets
                  key: SECRET_KEY
            - name: ENCRYPTION_SALT_KEYS
              valueFrom:
                secretKeyRef:
                  name: posthog-secrets
                  key: ENCRYPTION_SALT_KEYS
            - name: DEPLOYMENT
              value: hobby
            - name: SKIP_ASYNC_MIGRATIONS_SETUP
              value: '0'
          resources:
            requests:
