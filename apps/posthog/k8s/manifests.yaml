apiVersion: v1
kind: Namespace
metadata:
  name: posthog
  labels:
    app.kubernetes.io/name: posthog

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capture
  labels:
    app.kubernetes.io/name: capture
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: capture
  template:
    metadata:
      labels:
        app.kubernetes.io/name: capture
    spec:
      containers:
        - name: capture
          image: ghcr.io/posthog/posthog/capture:master
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_HOSTS
              value: kafka:9092
            - name: REDIS_URL
              value: redis://redis:6379/
            - name: ADDRESS
              value: '0.0.0.0:3000'
            - name: KAFKA_TOPIC
              value: events_plugin_ingestion
            - name: CAPTURE_MODE
              value: events
            - name: RUST_LOG
              value: info,rdkafka=warn
            - name: CAPTURE_V1_SINKS
              value: msk
            - name: CAPTURE_V1_SINK_MSK_KAFKA_HOSTS
              value: kafka:9092
            - name: CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_MAIN
              value: events_plugin_ingestion
            - name: CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_HISTORICAL
              value: events_plugin_ingestion_historical
            - name: CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_OVERFLOW
              value: events_plugin_ingestion_overflow
            - name: CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_DLQ
              value: events_plugin_ingestion_dlq
            - name: CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_EXCEPTION
              value: ingestion-errortracking-main
            - name: CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_HEATMAP
              value: heatmaps_ingestion
            - name: CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_CLIENT_INGESTION_WARNING
              value: ingestion-clientwarnings-main-1
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: '50m'
              memory: '128Mi'
            limits:
              memory: '384Mi'
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: capture
  labels:
    app.kubernetes.io/name: capture
spec:
  selector:
    app.kubernetes.io/name: capture
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: replay-capture
  labels:
    app.kubernetes.io/name: replay-capture
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: replay-capture
  template:
    metadata:
      labels:
        app.kubernetes.io/name: replay-capture
    spec:
      containers:
        - name: capture
          image: ghcr.io/posthog/posthog/capture:master
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_HOSTS
              value: kafka:9092
            - name: REDIS_URL
              value: redis://redis:6379/
            - name: ADDRESS
              value: '0.0.0.0:3000'
            - name: KAFKA_TOPIC
              value: session_recording_snapshot_item_events
            - name: CAPTURE_MODE
              value: recordings
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: '50m'
              memory: '128Mi'
            limits:
              memory: '384Mi'
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: replay-capture
  labels:
    app.kubernetes.io/name: replay-capture
spec:
  selector:
    app.kubernetes.io/name: replay-capture
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-config
  labels:
    app.kubernetes.io/name: clickhouse
data:
  config.xml: |
    <?xml version="1.0"?>
    <!--
      NOTE: User and query level settings are set up in "users.xml" file.
      If you have accidentally specified user-level settings here, server won't start.
      You can either move the settings to the right place inside "users.xml" file
       or add <skip_check_for_incorrect_settings>1</skip_check_for_incorrect_settings> here.
    -->
    <clickhouse>
        <logger>
            <level>warning</level>
            <log>/var/log/clickhouse-server/clickhouse-server.log</log>
            <errorlog>/var/log/clickhouse-server/clickhouse-server.err.log</errorlog>
            <size>1000M</size>
            <count>10</count>
        </logger>
    
        <http_port>8123</http_port>
        <mysql_port>9004</mysql_port>
        <postgresql_port>9005</postgresql_port>
        <https_port>8443</https_port>
        <tcp_port_secure>9440</tcp_port_secure>
        <interserver_http_port>9009</interserver_http_port>
        <max_connections>4096</max_connections>
        <keep_alive_timeout>3</keep_alive_timeout>
    
        <openSSL>
            <server>
                <certificateFile>/etc/clickhouse-server/server.crt</certificateFile>
                <privateKeyFile>/etc/clickhouse-server/server.key</privateKeyFile>
                <dhParamsFile>/etc/clickhouse-server/dhparam.pem</dhParamsFile>
                <verificationMode>none</verificationMode>
                <loadDefaultCAFile>true</loadDefaultCAFile>
                <cacheSessions>true</cacheSessions>
                <disableProtocols>sslv2,sslv3</disableProtocols>
                <preferServerCiphers>true</preferServerCiphers>
            </server>
    
            <client>
                <loadDefaultCAFile>true</loadDefaultCAFile>
                <cacheSessions>true</cacheSessions>
                <disableProtocols>sslv2,sslv3</disableProtocols>
                <preferServerCiphers>true</preferServerCiphers>
                <invalidCertificateHandler>
                    <name>RejectCertificateHandler</name>
                </invalidCertificateHandler>
            </client>
        </openSSL>
    
        <!-- Maximum number of concurrent queries. -->
        <max_concurrent_queries>200</max_concurrent_queries>
    
        <!-- Maximum memory usage (resident set size) for server process.
             Zero value or unset means default. Default is "max_server_memory_usage_to_ram_ratio" of available
        physical RAM.
             If the value is larger than "max_server_memory_usage_to_ram_ratio" of available physical RAM, it
        will be cut down.
    
             The constraint is checked on query execution time.
             If a query tries to allocate memory and the current memory usage plus allocation is greater
              than specified threshold, exception will be thrown.
    
             It is not practical to set this constraint to small values like just a few gigabytes,
              because memory allocator will keep this amount of memory in caches and the server will deny service
        of queries.
          -->
        <max_server_memory_usage>0</max_server_memory_usage>
    
        <!-- Maximum number of threads in the Global thread pool.
        This will default to a maximum of 10000 threads if not specified.
        This setting will be useful in scenarios where there are a large number
        of distributed queries that are running concurrently but are idling most
        of the time, in which case a higher number of threads might be required.
        -->
    
        <!-- Must exceed the ~95 kafka_* engine tables, else consumers starve and their MVs stall. -->
        <background_message_broker_schedule_pool_size>128</background_message_broker_schedule_pool_size>
        <max_thread_pool_size>10000</max_thread_pool_size>
    
        <!-- how many threads merge files, default is 16 -->
        <background_pool_size>4</background_pool_size>
    
        <!-- Since 26.6, CREATE TABLE with a projection sanity-checks the built-in
             number_of_free_entries_in_pool_to_execute_mutation (20) and
             number_of_free_entries_in_pool_to_execute_optimize_entire_partition (25)
             defaults against background_pool_size * this ratio, ignoring our
             <merge_tree> overrides. 4 * 8 = 32 satisfies both checks without
             adding merge threads. -->
        <background_merges_mutations_concurrency_ratio>8</background_merges_mutations_concurrency_ratio>
    
        <!-- Number of workers to recycle connections in background (see also drain_timeout).
             If the pool is full, connection will be drained synchronously. -->
        <!-- <max_threads_for_connection_collector>10</max_threads_for_connection_collector> -->
    
        <!-- On memory constrained environments you may have to set this to value larger than 1.
          -->
        <max_server_memory_usage_to_ram_ratio>0.9</max_server_memory_usage_to_ram_ratio>
    
        <!-- Simple server-wide memory profiler. Collect a stack trace at every peak allocation step (in
        bytes).
             Data will be stored in system.trace_log table with query_id = empty string.
             Zero means disabled.
          -->
        <total_memory_profiler_step>4194304</total_memory_profiler_step>
    
        <!-- Collect random allocations and deallocations and write them into system.trace_log with
        'MemorySample' trace_type.
             The probability is for every alloc/free regardless to the size of the allocation.
             Note that sampling happens only when the amount of untracked memory exceeds the untracked memory
        limit,
              which is 4 MiB by default but can be lowered if 'total_memory_profiler_step' is lowered.
             You may want to set 'total_memory_profiler_step' to 1 for extra fine grained sampling.
          -->
        <total_memory_tracker_sample_probability>0</total_memory_tracker_sample_probability>
    
        <!-- Set limit on number of open files (default: maximum). This setting makes sense on Mac OS X
        because getrlimit() fails to retrieve
             correct maximum value. -->
        <!-- <max_open_files>262144</max_open_files> -->
    
        <!-- Size of cache of uncompressed blocks of data, used in tables of MergeTree family.
             In bytes. Cache is single for server. Memory is allocated only on demand.
             Cache is used when 'use_uncompressed_cache' user setting turned on (off by default).
             Uncompressed cache is advantageous only for very short queries and in rare cases.
    
             Note: uncompressed cache can be pointless for lz4, because memory bandwidth
             is slower than multi-core decompression on some server configurations.
             Enabling it can sometimes paradoxically make queries slower.
          -->
        <uncompressed_cache_size>8589934592</uncompressed_cache_size>
    
        <!-- Approximate size of mark cache, used in tables of MergeTree family.
             In bytes. Cache is single for server. Memory is allocated only on demand.
             You should not lower this value.
          -->
        <mark_cache_size>5368709120</mark_cache_size>
    
        <mmap_cache_size>1000</mmap_cache_size>
    
        <!-- Cache size in bytes for compiled expressions.-->
        <compiled_expression_cache_size>134217728</compiled_expression_cache_size>
    
        <!-- Cache size in elements for compiled expressions.-->
        <compiled_expression_cache_elements_size>10000</compiled_expression_cache_elements_size>
    
        <!-- Path to data directory, with trailing slash. -->
        <path>/var/lib/clickhouse/</path>
    
        <!-- Path to temporary data for processing hard queries. -->
        <tmp_path>/var/lib/clickhouse/tmp/</tmp_path>
    
        <!-- Directory with user provided files that are accessible by 'file' table function. -->
        <user_files_path>/var/lib/clickhouse/user_files/</user_files_path>
    
        <user_directories>
            <users_xml>
                <!-- Path to configuration file with predefined users. -->
                <path>users.xml</path>
            </users_xml>
            <local_directory>
                <!-- Path to folder where users created by SQL commands are stored. -->
                <path>/var/lib/clickhouse/access/</path>
            </local_directory>
    
        </user_directories>
    
        <default_profile>default</default_profile>
    
        <custom_settings_prefixes></custom_settings_prefixes>
    
        <default_database>default</default_database>
    
        <mlock_executable>true</mlock_executable>
    
        <!-- Reallocate memory for machine code ("text") using huge pages. Highly experimental. -->
        <remap_executable>false</remap_executable>
    
        <remote_url_allow_hosts>
            <host_regexp>.*</host_regexp>
        </remote_url_allow_hosts>
    
        <zookeeper>
            <node>
                <host>zookeeper</host>
                <port>2181</port>
            </node>
        </zookeeper>
    
        <!-- Reloading interval for embedded dictionaries, in seconds. Default: 3600. -->
        <builtin_dictionaries_reload_interval>3600</builtin_dictionaries_reload_interval>
    
        <!-- Maximum session timeout, in seconds. Default: 3600. -->
        <max_session_timeout>3600</max_session_timeout>
    
        <!-- Default session timeout, in seconds. Default: 60. -->
        <default_session_timeout>60</default_session_timeout>
    
        <!-- Query log. Used only for queries with setting log_queries = 1. -->
        <query_log>
            <!-- What table to insert data. If table is not exist, it will be created.
                 When query log structure is changed after system update,
                  then old table will be renamed and new table will be created automatically.
            -->
            <database>system</database>
            <table>query_log</table>
            <partition_by>toYYYYMM(event_date)</partition_by>
    
            <!-- Interval of flushing data. -->
            <flush_interval_milliseconds>500</flush_interval_milliseconds>
            <!-- Maximal size in lines for the logs. When non-flushed logs amount reaches max_size, logs dumped to the disk. -->
            <max_size_rows>8388608</max_size_rows>
            <!-- Pre-allocated size in lines for the logs. -->
            <reserved_size_rows>8192</reserved_size_rows>
            <!-- Lines amount threshold, reaching it launches flushing logs to the disk in background. -->
            <buffer_size_rows_flush_threshold>524288</buffer_size_rows_flush_threshold>
            <!-- Indication whether logs should be dumped to the disk in case of a crash -->
            <flush_on_crash>true</flush_on_crash>
    
            <!-- example of using a different storage policy for a system table -->
            <!-- storage_policy>local_ssd</storage_policy -->
    
            <ttl>event_date + INTERVAL 12 DAY</ttl>
            <ttl_only_drop_parts>1</ttl_only_drop_parts>
        </query_log>
    
        <!-- Query thread log. Has information about all threads participated in query execution.
             Used only for queries with setting log_query_threads = 1. -->
        <query_thread_log>
            <database>system</database>
            <table>query_thread_log</table>
            <partition_by>toYYYYMM(event_date)</partition_by>
            <flush_interval_milliseconds>7500</flush_interval_milliseconds>
            <max_size_rows>8388608</max_size_rows>
            <reserved_size_rows>8192</reserved_size_rows>
            <buffer_size_rows_flush_threshold>524288</buffer_size_rows_flush_threshold>
            <flush_on_crash>false</flush_on_crash>
    
            <ttl>event_date + INTERVAL 5 DAY</ttl>
            <ttl_only_drop_parts>1</ttl_only_drop_parts>
        </query_thread_log>
    
        <!-- Query views log. Has information about all dependent views associated with a query.
             Used only for queries with setting log_query_views = 1. -->
        <query_views_log>
            <database>system</database>
            <table>query_views_log</table>
            <partition_by>toYYYYMM(event_date)</partition_by>
            <flush_interval_milliseconds>7500</flush_interval_milliseconds>
    
            <ttl>event_date + INTERVAL 5 DAY</ttl>
            <ttl_only_drop_parts>1</ttl_only_drop_parts>
        </query_views_log>
    
    
        <text_log>
            <database>system</database>
            <table>text_log</table>
            <flush_interval_milliseconds>7500</flush_interval_milliseconds>
            <level>trace</level>
    
            <ttl>event_date + INTERVAL 5 DAY</ttl>
            <ttl_only_drop_parts>1</ttl_only_drop_parts>
        </text_log>
    
        <!-- Metric log contains rows with current values of ProfileEvents, CurrentMetrics collected
        with "collect_interval_milliseconds" interval. -->
        <metric_log>
            <database>system</database>
            <table>metric_log</table>
            <flush_interval_milliseconds>7500</flush_interval_milliseconds>
            <collect_interval_milliseconds>1000</collect_interval_milliseconds>
    
            <ttl>event_date + INTERVAL 5 DAY</ttl>
            <ttl_only_drop_parts>1</ttl_only_drop_parts>
        </metric_log>
    
        <!--
            Asynchronous metric log contains values of metrics from
            system.asynchronous_metrics.
        -->
        <asynchronous_metric_log>
            <database>system</database>
            <table>asynchronous_metric_log</table>
            <!--
                Asynchronous metrics are updated once a minute, so there is
                no need to flush more often.
            -->
            <flush_interval_milliseconds>7000</flush_interval_milliseconds>
    
            <ttl>event_date + INTERVAL 5 DAY</ttl>
            <ttl_only_drop_parts>1</ttl_only_drop_parts>
        </asynchronous_metric_log>
    
        <!--
            OpenTelemetry log contains OpenTelemetry trace spans.
        -->
        <opentelemetry_span_log>
            <!--
                The default table creation code is insufficient, this <engine> spec
                is a workaround. There is no 'event_time' for this log, but two times,
                start and finish. It is sorted by finish time, to avoid inserting
                data too far away in the past (probably we can sometimes insert a span
                that is seconds earlier than the last span in the table, due to a race
                between several spans inserted in parallel). This gives the spans a
                global order that we can use to e.g. retry insertion into some external
                system.
            -->
            <engine>
                engine MergeTree
                partition by toYYYYMM(finish_date)
                order by (finish_date, finish_time_us, trace_id)
            </engine>
            <database>system</database>
            <table>opentelemetry_span_log</table>
            <flush_interval_milliseconds>7500</flush_interval_milliseconds>
        </opentelemetry_span_log>
    
    
        <!-- Crash log. Stores stack traces for fatal errors.
             This table is normally empty. -->
        <crash_log>
            <database>system</database>
            <table>crash_log</table>
    
            <partition_by />
            <flush_interval_milliseconds>1000</flush_interval_milliseconds>
            <max_size_rows>1024</max_size_rows>
            <reserved_size_rows>1024</reserved_size_rows>
            <buffer_size_rows_flush_threshold>512</buffer_size_rows_flush_threshold>
            <flush_on_crash>true</flush_on_crash>
        </crash_log>
    
        <!-- Session log. Stores user log in (successful or not) and log out events. -->
        <session_log>
            <database>system</database>
            <table>session_log</table>
    
            <partition_by>toYYYYMM(event_date)</partition_by>
            <flush_interval_milliseconds>7500</flush_interval_milliseconds>
    
            <ttl>event_date + INTERVAL 5 DAY</ttl>
            <ttl_only_drop_parts>1</ttl_only_drop_parts>
        </session_log>
    
        <backup_log>
            <database>system</database>
            <table>backup_log</table>
            <partition_by>toYYYYMM(event_date)</partition_by>
            <flush_interval_milliseconds>7500</flush_interval_milliseconds>
    
            <ttl>event_date + INTERVAL 5 DAY</ttl>
            <ttl_only_drop_parts>1</ttl_only_drop_parts>
        </backup_log>
    
        <!-- Custom TLD lists.
             Format: <name>/path/to/file</name>
    
             Changes will not be applied w/o server restart.
             Path to the list is under top_level_domains_path (see above).
        -->
        <top_level_domains_lists>
            <!--
            <public_suffix_list>/path/to/public_suffix_list.dat</public_suffix_list>
            -->
        </top_level_domains_lists>
    
        <!-- Configuration of external dictionaries. See:
             https://clickhouse.com/docs/en/sql-reference/dictionaries/external-dictionaries/external-dicts
        -->
        <dictionaries_config>*_dictionary.xml</dictionaries_config>
    
        <!-- Configuration of user defined executable functions -->
        <user_defined_executable_functions_config>*_function.xml</user_defined_executable_functions_config>
    
        <distributed_ddl>
            <!-- Path in ZooKeeper to queue with DDL queries -->
            <path>/clickhouse/task_queue/ddl</path>
        </distributed_ddl>
    
        <!-- Example of parameters for GraphiteMergeTree table engine -->
        <graphite_rollup_example>
            <pattern>
                <regexp>click_cost</regexp>
                <function>any</function>
                <retention>
                    <age>0</age>
                    <precision>3600</precision>
                </retention>
                <retention>
                    <age>86400</age>
                    <precision>60</precision>
                </retention>
            </pattern>
            <default>
                <function>max</function>
                <retention>
                    <age>0</age>
                    <precision>60</precision>
                </retention>
                <retention>
                    <age>3600</age>
                    <precision>300</precision>
                </retention>
                <retention>
                    <age>86400</age>
                    <precision>3600</precision>
                </retention>
            </default>
        </graphite_rollup_example>
    
        <!-- Directory in <clickhouse-path> containing schema files for various input formats.
             The directory will be created if it doesn't exist.
          -->
        <format_schema_path>/var/lib/clickhouse/format_schemas/</format_schema_path>
    
        <!-- Default query masking rules, matching lines would be replaced with something else in the
        logs
            (both text logs and system.query_log).
            name - name for the rule (optional)
            regexp - RE2 compatible regular expression (mandatory)
            replace - substitution string for sensitive data (optional, by default - six asterisks)
        -->
        <query_masking_rules>
            <rule>
                <name>hide encrypt/decrypt arguments</name>
                <regexp>((?:aes_)?(?:encrypt|decrypt)(?:_mysql)?)\s*\(\s*(?:'(?:\\'|.)+'|.*?)\s*\)</regexp>
                <!-- or more secure, but also more invasive:
                    (aes_\w+)\s*\(.*\)
                -->
                <replace>\1(???)</replace>
            </rule>
        </query_masking_rules>
    
        <merge_tree>
            <max_bytes_to_merge_at_max_space_in_pool>1073741824</max_bytes_to_merge_at_max_space_in_pool>
            <number_of_free_entries_in_pool_to_execute_mutation>2</number_of_free_entries_in_pool_to_execute_mutation>
            <number_of_free_entries_in_pool_to_execute_optimize_entire_partition>2</number_of_free_entries_in_pool_to_execute_optimize_entire_partition>
        </merge_tree>
    </clickhouse>
  default.xml: |
    <clickhouse>
        <tcp_port>9000</tcp_port>
    
        <remote_servers>
            <posthog>
                <shard>
                    <replica>
                        <host>clickhouse</host>
                        <port>9000</port>
                    </replica>
                </shard>
            </posthog>
            <posthog_single_shard>
                <shard>
                    <replica>
                        <host>clickhouse</host>
                        <port>9000</port>
                    </replica>
                </shard>
            </posthog_single_shard>
            <posthog_migrations>
                <shard>
                    <replica>
                        <host>clickhouse</host>
                        <port>9000</port>
                    </replica>
                </shard>
            </posthog_migrations>
            <posthog_writable>
                <shard>
                    <replica>
                        <host>clickhouse</host>
                        <port>9000</port>
                    </replica>
                </shard>
            </posthog_writable>
            <posthog_primary_replica>
                <shard>
                    <replica>
                        <host>clickhouse</host>
                        <port>9000</port>
                    </replica>
                </shard>
            </posthog_primary_replica>
    
            <ai_events>
                <shard>
                    <replica>
                        <host>clickhouse</host>
                        <port>9000</port>
                    </replica>
                </shard>
            </ai_events>
            <aux>
                <shard>
                    <replica>
                        <host>clickhouse</host>
                        <port>9000</port>
                    </replica>
                </shard>
            </aux>
            <ops>
                <shard>
                    <replica>
                        <host>clickhouse</host>
                        <port>9000</port>
                    </replica>
                </shard>
            </ops>
            <sessions>
                <shard>
                    <replica>
                        <host>clickhouse</host>
                        <port>9000</port>
                    </replica>
                </shard>
            </sessions>
        </remote_servers>
    
        <named_collections>
            <msk_cluster>
                <kafka_broker_list from_env="KAFKA_HOSTS"/>
            </msk_cluster>
            <warpstream_ingestion>
                <kafka_broker_list from_env="KAFKA_HOSTS"/>
            </warpstream_ingestion>
            <warpstream_calculated_events>
                <kafka_broker_list from_env="KAFKA_HOSTS"/>
            </warpstream_calculated_events>
            <warpstream_replay>
                <kafka_broker_list from_env="KAFKA_HOSTS"/>
            </warpstream_replay>
            <warpstream_shared>
                <kafka_broker_list from_env="KAFKA_HOSTS"/>
            </warpstream_shared>
            <warpstream_cyclotron>
                <kafka_broker_list from_env="KAFKA_HOSTS"/>
            </warpstream_cyclotron>
            <warpstream_logs>
                <kafka_broker_list from_env="KAFKA_HOSTS"/>
            </warpstream_logs>
            <warpstream_traces>
                <kafka_broker_list from_env="KAFKA_HOSTS"/>
            </warpstream_traces>
        </named_collections>
    
        <macros>
            <shard>01</shard>
            <replica>ch1</replica>
            <hostClusterType>online</hostClusterType>
            <hostClusterRole>data</hostClusterRole>
        </macros>
    </clickhouse>
  users.xml: |
    <?xml version="1.0"?>
    <yandex>
        <!-- See also the files in users.d directory where the settings can be overridden. -->
    
        <!-- Profiles of settings. -->
        <profiles>
            <!-- Default settings. -->
            <default>
                <!-- Maximum memory usage for processing single query, in bytes. -->
                <max_memory_usage>10000000000</max_memory_usage>
    
    
                <!-- How to choose between replicas during distributed query processing.
                     random - choose random replica from set of replicas with minimum number of errors
                     nearest_hostname - from set of replicas with minimum number of errors, choose replica
                      with minimum number of different symbols between replica's hostname and local hostname
                      (Hamming distance).
                     in_order - first live replica is chosen in specified order.
                     first_or_random - if first replica one has higher number of errors, pick a random one from replicas
                with minimum number of errors.
                -->
                <load_balancing>random</load_balancing>
    
                <allow_nondeterministic_mutations>1</allow_nondeterministic_mutations>
    
                <compatibility>26.3</compatibility>
                <!-- The funnel correlation query intentionally uses a materialized CTE
                     to avoid re-running the actor subquery across UNION branches. -->
                <enable_materialized_cte>1</enable_materialized_cte>
                <!-- Keep inserts synchronous. Production configures async inserts explicitly
                     (currently off); the 26.3 compatibility default turns them on, which makes
                     every single-row test insert wait for the async flush and slows the suite. -->
                <async_insert>0</async_insert>
                <!-- 26.3 enables rewriting `col = ''` / `col != ''` into emptiness checks that
                     skip DEFAULT-expression evaluation on parts written before the column was
                     added. Materialized property columns rely on that evaluation for
                     is_set / is_not_set filters on rows older than their backfill window, so
                     pin the rewrite off until ClickHouse honors DEFAULTs there. -->
                <optimize_empty_string_comparisons>0</optimize_empty_string_comparisons>
                <distributed_product_mode>global</distributed_product_mode>
                <enable_parallel_replicas>0</enable_parallel_replicas>
                <max_parallel_replicas>1</max_parallel_replicas>
                <allow_experimental_window_functions>1</allow_experimental_window_functions>
                <allow_suspicious_low_cardinality_types>1</allow_suspicious_low_cardinality_types>
                <insert_distributed_sync>1</insert_distributed_sync>
                <throw_on_max_partitions_per_insert_block>false</throw_on_max_partitions_per_insert_block>
                <number_of_mutations_to_throw>1</number_of_mutations_to_throw>
    
            </default>
    
            <!-- Profile that allows only read queries. -->
            <readonly>
                <readonly>1</readonly>
            </readonly>
    
            <api>
                <profile>default</profile>
            </api>
    
            <app>
                <profile>default</profile>
            </app>
    
        </profiles>
    
        <!-- Users and ACL. -->
        <users>
            <!-- If user name was not specified, 'default' user is used. -->
            <default>
                <!-- See also the files in users.d directory where the password can be overridden.
    
                     Password could be specified in plaintext or in SHA256 (in hex format).
    
                     If you want to specify password in plaintext (not recommended), place it in 'password' element.
                     Example: <password>qwerty</password>.
                     Password could be empty.
    
                     If you want to specify SHA256, place it in 'password_sha256_hex' element.
                     Example:
                <password_sha256_hex>65e84be33532fb784c48129675f9eff3a682b27168c0ea744b2cf58ee02337c5</password_sha256_hex>
                     Restrictions of SHA256: impossibility to connect to ClickHouse using MySQL JS client (as of July
                2019).
    
                     If you want to specify double SHA1, place it in 'password_double_sha1_hex' element.
                     Example:
                <password_double_sha1_hex>e395796d6546b1b65db9d665cd43f0e858dd4303</password_double_sha1_hex>
    
                     If you want to specify a previously defined LDAP server (see 'ldap_servers' in the main config) for
                authentication,
                      place its name in 'server' element inside 'ldap' element.
                     Example: <ldap><server>my_ldap_server</server></ldap>
    
                     If you want to authenticate the user via Kerberos (assuming Kerberos is enabled, see 'kerberos' in
                the main config),
                      place 'kerberos' element instead of 'password' (and similar) elements.
                     The name part of the canonical principal name of the initiator must match the user name for
                authentication to succeed.
                     You can also place 'realm' element inside 'kerberos' element to further restrict authentication to
                only those requests
                      whose initiator's realm matches it.
                     Example: <kerberos />
                     Example: <kerberos><realm>EXAMPLE.COM</realm></kerberos>
    
                     How to generate decent password:
                     Execute: PASSWORD=$(base64 < /dev/urandom | head -c8); echo "$PASSWORD"; echo -n "$PASSWORD" |
                sha256sum | tr -d '-'
                     In first line will be password and in second - corresponding SHA256.
    
                     How to generate double SHA1:
                     Execute: PASSWORD=$(base64 < /dev/urandom | head -c8); echo "$PASSWORD"; echo -n "$PASSWORD" |
                sha1sum | tr -d '-' | xxd -r -p | sha1sum | tr -d '-'
                     In first line will be password and in second - corresponding double SHA1.
                -->
                <password></password>
    
                <!-- List of networks with open access.
    
                     To open access from everywhere, specify:
                        <ip>::/0</ip>
    
                     To open access only from localhost, specify:
                        <ip>::1</ip>
                        <ip>127.0.0.1</ip>
    
                     Each element of list has one of the following forms:
                     <ip> IP-address or network mask. Examples: 213.180.204.3 or 10.0.0.1/8 or 10.0.0.1/255.255.255.0
                         2a02:6b8::3 or 2a02:6b8::3/64 or 2a02:6b8::3/ffff:ffff:ffff:ffff::.
                     <host> Hostname. Example: server01.yandex.ru.
                         To check access, DNS query is performed, and all received addresses compared to peer address.
                     <host_regexp> Regular expression for host names. Example, ^server\d\d-\d\d-\d\.yandex\.ru$
                         To check access, DNS PTR query is performed for peer address and then regexp is applied.
                         Then, for result of PTR query, another DNS query is performed and all received addresses compared
                to peer address.
                         Strongly recommended that regexp is ends with $
                     All results of DNS requests are cached till server restart.
                -->
                <networks>
                    <ip>::/0</ip>
                </networks>
    
                <!-- Settings profile for user. -->
                <profile>default</profile>
    
                <!-- Quota for user. -->
                <quota>default</quota>
    
                <!-- User can create other users and grant rights to them. -->
                <access_management>1</access_management>
                <named_collection_control>1</named_collection_control>
                <show_named_collections>1</show_named_collections>
                <show_named_collections_secrets>1</show_named_collections_secrets>
            </default>
    
            <api>
                <password>apipass</password>
    
                <networks>
                    <ip>::/0</ip>
                </networks>
    
                <profile>api</profile>
    
                <quota>default</quota>
            </api>
    
            <app>
                <password>apppass</password>
    
                <networks>
                    <ip>::/0</ip>
                </networks>
    
                <profile>app</profile>
    
                <quota>default</quota>
            </app>
    
            <!-- Low-privilege reader baked into dictionary SOURCE(CLICKHOUSE(...)) clauses.
                 Mirrors prod's dict_reader: read-only, database-wide SELECT (not table-enumerated,
                 so new dictionary source tables are covered without editing this file). -->
            <dict_reader>
                <password>dictreaderpass</password>
    
                <networks>
                    <ip>::/0</ip>
                </networks>
    
                <profile>readonly</profile>
    
                <quota>default</quota>
    
                <access_management>0</access_management>
                <grants>
                    <query>GRANT SELECT ON default.*</query>
                    <query>GRANT SELECT ON posthog_test.*</query>
                </grants>
            </dict_reader>
        </users>
    
        <!-- Quotas. -->
        <quotas>
            <!-- Name of quota. -->
            <default>
                <!-- Limits for time interval. You could specify many intervals with different limits. -->
                <interval>
                    <!-- Length of interval. -->
                    <duration>3600</duration>
    
                    <!-- No limits. Just calculate resource usage for time interval. -->
                    <queries>0</queries>
                    <errors>0</errors>
                    <result_rows>0</result_rows>
                    <read_rows>0</read_rows>
                    <execution_time>0</execution_time>
                </interval>
            </default>
        </quotas>
    </yandex>

