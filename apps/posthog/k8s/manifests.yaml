metadata:
  name: plugins
  labels:
    app.kubernetes.io/name: plugins
spec:
  selector:
    app.kubernetes.io/name: plugins
  ports:
    - port: 6738
      targetPort: 6738
      protocol: TCP
      name: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recording-api
  labels:
    app.kubernetes.io/name: recording-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: recording-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recording-api
    spec:
      containers:
        - name: plugin-server
          image: posthog/posthog-node:latest
          imagePullPolicy: IfNotPresent
          command:
            - node
            - nodejs/dist/index.js
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: posthog-pg-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: posthog-pg-app
                  key: password
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: posthog-pg-app
                  key: host
            - name: DATABASE_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@$(PGHOST):5432/posthog
            - name: REDIS_URL
              value: redis://redis:6379/
            - name: CLICKHOUSE_HOST
              value: clickhouse
            - name: CLICKHOUSE_DATABASE
              value: posthog
            - name: CLICKHOUSE_SECURE
              value: 'false'
            - name: CLICKHOUSE_VERIFY
              value: 'false'
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: posthog-secrets
                  key: SECRET_KEY
            - name: ENCRYPTION_SALT_KEYS
              valueFrom:
                secretKeyRef:
                  name: posthog-secrets
                  key: ENCRYPTION_SALT_KEYS
            - name: PLUGIN_SERVER_MODE
              value: recording-api
            - name: SESSION_RECORDING_API_REDIS_HOST
              value: redis
            - name: SESSION_RECORDING_API_REDIS_PORT
              value: '6379'
          ports:
            - containerPort: 6738
              name: http
          resources:
            requests:
              cpu: '50m'
              memory: '256Mi'
            limits:
              memory: '768Mi'
          readinessProbe:
            tcpSocket:
              port: 6738
            initialDelaySeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6738
            initialDelaySeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: recording-api
  labels:
    app.kubernetes.io/name: recording-api
spec:
  selector:
    app.kubernetes.io/name: recording-api
  ports:
    - port: 6738
      targetPort: 6738
      protocol: TCP
      name: http

---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: posthog-pg
  labels:
    app.kubernetes.io/name: posthog-pg
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6-standard-trixie
  bootstrap:
    initdb:
      database: posthog
      owner: posthog
      postInitSQL:
        - CREATE DATABASE posthog_persons OWNER posthog;
  storage:
    storageClass: longhorn
    size: '20Gi'
  resources:
    requests:
      cpu: '100m'
      memory: '512Mi'
    limits:
      memory: '1Gi'

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: property-defs-rs
  labels:
    app.kubernetes.io/name: property-defs-rs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: property-defs-rs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: property-defs-rs
    spec:
      containers:
        - name: property-defs-rs
          image: ghcr.io/posthog/posthog/property-defs-rs:master
          imagePullPolicy: IfNotPresent
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: posthog-pg-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: posthog-pg-app
                  key: password
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: posthog-pg-app
                  key: host
            - name: DATABASE_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@$(PGHOST):5432/posthog
            - name: KAFKA_HOSTS
              value: kafka:9092
            - name: SKIP_WRITES
              value: 'false'
            - name: SKIP_READS
              value: 'false'
            - name: FILTER_MODE
              value: opt-out
          resources:
            requests:
              cpu: '50m'
              memory: '128Mi'
            limits:
              memory: '384Mi'

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
            - --maxmemory-policy
            - allkeys-lru
            - --maxmemory
            - '200mb'
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: '25m'
              memory: '64Mi'
            limits:
              memory: '256Mi'
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis

---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: posthog-secrets
  labels:
    app.kubernetes.io/name: posthog-secrets
spec:
  hostAPI: http://infisical.infisical.svc.cluster.local:8080
  resyncInterval: 60
  authentication:
    kubernetesAuth:
      identityId: REPLACE_ME_POSTHOG_OPERATOR_IDENTITY_ID
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: posthog-infisical
        namespace: posthog
      secretsScope:
        projectSlug: REPLACE_ME_POSTHOG_PROJECT_SLUG
        envSlug: prod
        secretsPath: /
  managedSecretReference:
    secretName: posthog-secrets
    secretNamespace: posthog
    creationPolicy: Orphan

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: posthog-infisical
  labels:
    app.kubernetes.io/name: posthog-infisical

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
  annotations:
    secrets.infisical.com/auto-reload: 'true'
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
      annotations:
        secrets.infisical.com/auto-reload: 'true'
    spec:
      containers:
        - name: web
          image: posthog/posthog:latest
          imagePullPolicy: IfNotPresent
          command:
            - ./bin/docker-server
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: posthog-pg-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: posthog-pg-app
                  key: password
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: posthog-pg-app
                  key: host
            - name: DATABASE_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@$(PGHOST):5432/posthog
            - name: REDIS_URL
              value: redis://redis:6379/
            - name: KAFKA_HOSTS
              value: kafka:9092
            - name: CLICKHOUSE_HOST
              value: clickhouse
            - name: CLICKHOUSE_DATABASE
              value: posthog
            - name: CLICKHOUSE_SECURE
              value: 'false'
            - name: CLICKHOUSE_VERIFY
              value: 'false'
            - name: OBJECT_STORAGE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: posthog-object-storage-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: OBJECT_STORAGE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: posthog-object-storage-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: OBJECT_STORAGE_ENDPOINT
              value: http://s3.garage.svc.cluster.local:3900
            - name: OBJECT_STORAGE_ENABLED
              value: 'true'
            - name: OBJECT_STORAGE_FORCE_PATH_STYLE
              value: 'true'
            - name: OBJECT_STORAGE_BUCKET
              value: posthog
            - name: SESSION_RECORDING_V2_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: posthog-object-storage-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: posthog-object-storage-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: SESSION_RECORDING_V2_S3_ENDPOINT
              value: http://s3.garage.svc.cluster.local:3900
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: posthog-secrets
                  key: SECRET_KEY
            - name: ENCRYPTION_SALT_KEYS
              valueFrom:
                secretKeyRef:
                  name: posthog-secrets
                  key: ENCRYPTION_SALT_KEYS
            - name: PERSONHOG_ADDR
              value: personhog-router:50052
            - name: PERSONHOG_ENABLED
              value: 'true'
            - name: FEATURE_FLAGS_SERVICE_URL
              value: http://feature-flags:3001
            - name: SITE_URL
              value: https://highrise.inevitable.fyi
            - name: IS_BEHIND_PROXY
              value: 'true'
            - name: DISABLE_SECURE_SSL_REDIRECT
              value: 'true'
            - name: DEPLOYMENT
              value: hobby
            - name: OTEL_SDK_DISABLED
              value: 'true'
            - name: RECORDING_API_URL
              value: http://recording-api:6738
            - name: POSTHOG_SKIP_MIGRATION_CHECKS
              value: '1'
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: '100m'
              memory: '512Mi'
            limits:
              memory: '1.5Gi'
          readinessProbe:
            httpGet:
              path: /_health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http

