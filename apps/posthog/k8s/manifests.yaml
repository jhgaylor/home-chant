        - name: wait-for-clickhouse
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z clickhouse 9000; do echo waiting for clickhouse; sleep 2; done
      containers:
        - name: migrate
          image: posthog/posthog:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
          args:
            - python manage.py migrate && python manage.py migrate_clickhouse && python manage.py run_async_migrations
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: posthog-pg-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: posthog-pg-app
                  key: password
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: posthog-pg-app
                  key: host
            - name: DATABASE_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@$(PGHOST):5432/posthog
            - name: REDIS_URL
              value: redis://redis:6379/
            - name: KAFKA_HOSTS
              value: kafka:9092
            - name: CLICKHOUSE_HOST
              value: clickhouse
            - name: CLICKHOUSE_DATABASE
              value: posthog
            - name: CLICKHOUSE_SECURE
              value: 'false'
            - name: CLICKHOUSE_VERIFY
              value: 'false'
            - name: OBJECT_STORAGE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: posthog-object-storage-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: OBJECT_STORAGE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: posthog-object-storage-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: OBJECT_STORAGE_ENDPOINT
