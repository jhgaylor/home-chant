---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-initdb
  labels:
    app.kubernetes.io/name: clickhouse
data:
  init-db.sh: |
    #!/bin/bash
    set -e
    
    cp -r /idl/* /var/lib/clickhouse/format_schemas/
    
    # Wait for ClickHouse to be ready to accept queries, then flush log tables to ensure
    # system log tables (e.g., system.crash_log) are created. Use timeout to avoid hanging.
    READY=false
    for i in {1..30}; do
        if clickhouse client --query "select 1" > /dev/null 2>&1; then
            clickhouse client --query "system flush logs"
            READY=true
            break
        fi
        sleep 1
    done
    
    if [ "$READY" = false ]; then
        echo "ClickHouse failed to become ready after 30 seconds" >&2
        exit 1
    fi

---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  labels:
    app.kubernetes.io/name: clickhouse
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: clickhouse
  ports:
    - port: 8123
      targetPort: 8123
      protocol: TCP
      name: http
    - port: 9000
      targetPort: 9000
      protocol: TCP
      name: native
    - port: 9009
      targetPort: 9009
      protocol: TCP
      name: interserver

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  labels:
    app.kubernetes.io/name: clickhouse
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:26.6.1.1193
          imagePullPolicy: IfNotPresent
          env:
            - name: CLICKHOUSE_SKIP_USER_SETUP
              value: '1'
            - name: KAFKA_HOSTS
              value: kafka:9092
          ports:
            - containerPort: 8123
              name: http
            - containerPort: 9000
              name: native
            - containerPort: 9009
              name: interserver
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: config
              mountPath: /etc/clickhouse-server/config.xml
              subPath: config.xml
            - name: config
              mountPath: /etc/clickhouse-server/config.d/default.xml
              subPath: default.xml
            - name: config
              mountPath: /etc/clickhouse-server/users.xml
              subPath: users.xml
            - name: idl
              mountPath: /idl
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: '250m'
              memory: '1Gi'
            limits:
              cpu: '1'
              memory: '2Gi'
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: clickhouse-config
        - name: idl
          configMap:
            name: clickhouse-idl
        - name: initdb
          configMap:
            name: clickhouse-initdb
            defaultMode: 493
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: '20Gi'

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feature-flags
  labels:
    app.kubernetes.io/name: feature-flags
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: feature-flags
  template:
    metadata:
      labels:
        app.kubernetes.io/name: feature-flags
    spec:
      containers:
        - name: feature-flags
          image: ghcr.io/posthog/posthog/feature-flags:master
          imagePullPolicy: IfNotPresent
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: posthog-pg-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: posthog-pg-app
                  key: password
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: posthog-pg-app
                  key: host
            - name: WRITE_DATABASE_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@$(PGHOST):5432/posthog
            - name: READ_DATABASE_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@$(PGHOST):5432/posthog
            - name: PERSONS_WRITE_DATABASE_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@$(PGHOST):5432/posthog
            - name: PERSONS_READ_DATABASE_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@$(PGHOST):5432/posthog
            - name: REDIS_URL
              value: redis://redis:6379/
            - name: ADDRESS
              value: '0.0.0.0:3001'
            - name: RUST_LOG
              value: info
